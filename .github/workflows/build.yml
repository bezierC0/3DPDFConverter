name: Build Windows Project

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OCC_VERSION: '7.8.0'
      OCC_VERSION_TAG: 'V7_8_0'
      OCC_ZIP_sha256: '82afb7bd5fd7097189ee4e98bf3bc02b4030cae7a82967db68d5f2b556801779'
      VS_VERSION: 'Visual Studio 17 2022'
      OCC_ROOT: 'C:\opencascade'
      VCPKG_ROOT: 'C:\vcpkg'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Cache OpenCASCADE archive
      id: cache-occ
      uses: actions/cache@v4
      with:
        path: |
          occt-vc143-64.zip
          3rdparty-vc14-64.zip
        key: ${{ runner.os }}-OpenCASCADE-${{ env.OCC_VERSION }}-precompiled-msvc

    - name: Download OpenCascade
      if: steps.cache-occ.outputs.cache-hit != 'true'
      uses: carlosperate/download-file-action@v2
      with:
          file-url: 'https://github.com/Open-Cascade-SAS/OCCT/releases/download/${{env.OCC_VERSION_TAG}}/occt-vc143-64.zip'
          file-path: occt-vc143-64.zip

    - name: Download OpenCascade 3rdparty
      if: steps.cache-occ.outputs.cache-hit != 'true'
      uses: carlosperate/download-file-action@v2
      with:
          file-url: 'https://github.com/Open-Cascade-SAS/OCCT/releases/download/${{env.OCC_VERSION_TAG}}/3rdparty-vc14-64.zip'
          file-path: 3rdparty-vc14-64.zip

    - name: Extract OpenCascade
      run: 7z x occt-vc143-64.zip

    - name: Extract OpenCascade 3rdparty
      run: 7z x 3rdparty-vc14-64.zip

    - name: Get count of CPU cores
      uses: SimenB/github-actions-cpu-cores@v1
      id: cpu-cores

    - name: Configure Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build
      shell: cmd
      run: |
          mkdir ${{github.workspace}}\build
          cd ${{github.workspace}}\build
          cmake --version
          cmake .. ^
                -DOpenCASCADE_DIR=${{github.workspace}}\occt-vc143-64 ^
                -DOpenCASCADE_3RDPARTY_DIR=${{github.workspace}}\3rdparty-vc14-64 ^
                -DBUILD_TESTS=ON
          cmake --build . ^
                --config Release ^
                --parallel ${{steps.cpu-cores.outputs.count}}

    - name: Test
      shell: cmd
      run: ctest --test-dir ${{github.workspace}}\build -C Release --output-on-failure

    - name: Upload Module
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/**/*.log
          CMakeFiles/**/*.log
        retention-days: 1

    - name: Package Windows release
      shell: cmd
      run: cmake --build ${{github.workspace}}\build --config Release --target package

    - name: Upload Windows release package
      uses: actions/upload-artifact@v4
      with:
        name: 3DPDFConverter-0.1.0-windows-x64
        path: build/3DPDFConverter-0.1.0-windows-x64.zip
        if-no-files-found: error
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libocct-data-exchange-dev libocct-draw-dev libocct-foundation-dev libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-ocaf-dev libocct-visualization-dev libtbb-dev rapidjson-dev
        
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cd build
        cmake --build . --config Release --parallel $(nproc)

  build-macos:
    runs-on: macos-15
    timeout-minutes: 30
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install OpenCASCADE
      run: |
        brew install opencascade tbb rapidjson
        
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        
    - name: Build
      run: |
        cd build
        cmake --build . --config Release --parallel $(sysctl -n hw.ncpu)
